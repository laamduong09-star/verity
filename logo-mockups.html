<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verity: Logo Mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --paper: #e7e6e2;
    --card: #faf9f7;
    --ink: #11151f;
    --slate: #5d5f68;
    --border: #d5d3cd;
    --blue: #2348ad;
    --blue-start: #3a5fd9;
    --blue-end: #1d3a8f;
    --font-display: 'Lexend', sans-serif;
    --font-body: 'Be Vietnam Pro', sans-serif;
  }

  body {
    background: var(--paper);
    font-family: var(--font-body);
    color: var(--ink);
    padding: 48px 32px;
    min-height: 100vh;
  }

  h1 {
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--slate);
    margin-bottom: 40px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
    max-width: 640px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 28px 28px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .card-label {
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--slate);
  }

  /* ── Topbar preview ── */
  .topbar-preview {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .logo-mark {
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .logo-text {
    font-family: var(--font-display);
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--ink);
    line-height: 1;
  }

  /* ── Large display ── */
  .display-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px 0 16px;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }

  .display-text {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--ink);
    line-height: 1;
  }

  /* ── Small sizes row ── */
  .sizes-row {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .size-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .size-label {
    font-size: 10px;
    color: var(--slate);
    font-family: var(--font-body);
  }

  /* ── Option letter ── */
  .option-letter {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
  }

  .option-name {
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    margin-top: 2px;
  }

  .option-desc {
    font-size: 13px;
    color: var(--slate);
    line-height: 1.5;
    margin-top: 4px;
  }

  /* ── Recommended badge ── */
  .badge {
    display: inline-block;
    background: var(--blue);
    color: #fff;
    font-family: var(--font-body);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 200px;
    margin-left: 8px;
    vertical-align: middle;
  }
</style>
</head>
<body>

<h1>Verity: Logo Options</h1>

<div class="grid">

  <!-- ── D: Converging Paths ── -->
  <div class="card">
    <div>
      <span class="option-letter">D</span>
      <div class="option-name">Verity Mark <span class="badge">Final</span></div>
      <div class="option-desc">App-icon style squircle badge with a soft rounded V, inspired by Amplemarket's mark. Self-contained tile that works on any background, from favicon to display.</div>
    </div>

    <div>
      <div class="card-label" style="margin-bottom:10px">Topbar</div>
      <div class="topbar-preview">
        <div class="logo-mark">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="grad-bg-sm" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#20263a"/>
                <stop offset="100%" stop-color="#0d0f16"/>
              </linearGradient>
            </defs>
            <rect x="0" y="0" width="20" height="20" rx="4" fill="url(#grad-bg-sm)"/>
            <polygon points="4,3 7,3 9.7,17 6.7,17" fill="#ffffff"/>
            <polygon points="10.3,17 12,9 13.5,9 13.5,3 16.5,3 14,17" fill="#ffffff"/>
          </svg>
          <span class="logo-text">Verity</span>
        </div>
      </div>
    </div>

    <div>
      <div class="card-label" style="margin-bottom:12px">Display</div>
      <div class="display-row">
        <svg width="36" height="36" viewBox="0 0 20 20" fill="none">
          <defs>
            <linearGradient id="grad-bg-lg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#20263a"/>
              <stop offset="100%" stop-color="#0d0f16"/>
            </linearGradient>
          </defs>
          <rect x="0" y="0" width="20" height="20" rx="4" fill="url(#grad-bg-lg)"/>
          <polygon points="4,3 7,3 9.7,17 6.7,17" fill="#ffffff"/>
          <polygon points="10.3,17 12,9 13.5,9 13.5,3 16.5,3 14,17" fill="#ffffff"/>
        </svg>
        <span class="display-text">Verity</span>
      </div>
    </div>

    <div>
      <div class="card-label" style="margin-bottom:10px">Sizes</div>
      <div class="sizes-row">
        <div class="size-item">
          <svg width="32" height="32" viewBox="0 0 20 20" fill="none">
            <defs>
              <linearGradient id="grad-bg-32" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#20263a"/><stop offset="100%" stop-color="#0d0f16"/>
              </linearGradient>
            </defs>
            <rect x="0" y="0" width="20" height="20" rx="4" fill="url(#grad-bg-32)"/>
            <polygon points="4,3 7,3 9.7,17 6.7,17" fill="#ffffff"/>
            <polygon points="10.3,17 12,9 13.5,9 13.5,3 16.5,3 14,17" fill="#ffffff"/>
          </svg>
          <span class="size-label">32px</span>
        </div>
        <div class="size-item">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <defs>
              <linearGradient id="grad-bg-20" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#20263a"/><stop offset="100%" stop-color="#0d0f16"/>
              </linearGradient>
            </defs>
            <rect x="0" y="0" width="20" height="20" rx="4" fill="url(#grad-bg-20)"/>
            <polygon points="4,3 7,3 9.7,17 6.7,17" fill="#ffffff"/>
            <polygon points="10.3,17 12,9 13.5,9 13.5,3 16.5,3 14,17" fill="#ffffff"/>
          </svg>
          <span class="size-label">20px</span>
        </div>
        <div class="size-item">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none">
            <defs>
              <linearGradient id="grad-bg-16" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#20263a"/><stop offset="100%" stop-color="#0d0f16"/>
              </linearGradient>
            </defs>
            <rect x="0" y="0" width="20" height="20" rx="4" fill="url(#grad-bg-16)"/>
            <polygon points="4,3 7,3 9.7,17 6.7,17" fill="#ffffff"/>
            <polygon points="10.3,17 12,9 13.5,9 13.5,3 16.5,3 14,17" fill="#ffffff"/>
          </svg>
          <span class="size-label">16px</span>
        </div>
      </div>
    </div>
  </div>

</div>

</body>
</html>
