<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verity: Logo Mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --paper: #e7e6e2;
    --card: #faf9f7;
    --ink: #11151f;
    --slate: #5d5f68;
    --border: #d5d3cd;
    --blue: #2348ad;
    --blue-start: #3a5fd9;
    --blue-end: #1d3a8f;
    --font-display: 'Lexend', sans-serif;
    --font-body: 'Be Vietnam Pro', sans-serif;
  }

  body {
    background: var(--paper);
    font-family: var(--font-body);
    color: var(--ink);
    padding: 48px 32px;
    min-height: 100vh;
  }

  h1 {
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--slate);
    margin-bottom: 40px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
    max-width: 640px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 28px 28px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .card-label {
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--slate);
  }

  /* ── Topbar preview ── */
  .topbar-preview {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .logo-mark {
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .logo-text {
    font-family: var(--font-display);
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--ink);
    line-height: 1;
  }

  /* ── Large display ── */
  .display-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px 0 16px;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }

  .display-text {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--ink);
    line-height: 1;
  }

  /* ── Small sizes row ── */
  .sizes-row {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .size-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .size-label {
    font-size: 10px;
    color: var(--slate);
    font-family: var(--font-body);
  }

  /* ── Option letter ── */
  .option-letter {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
  }

  .option-name {
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    margin-top: 2px;
  }

  .option-desc {
    font-size: 13px;
    color: var(--slate);
    line-height: 1.5;
    margin-top: 4px;
  }

  /* ── Recommended badge ── */
  .badge {
    display: inline-block;
    background: var(--blue);
    color: #fff;
    font-family: var(--font-body);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 200px;
    margin-left: 8px;
    vertical-align: middle;
  }
</style>
</head>
